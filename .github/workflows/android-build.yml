```yaml
name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Configure Start.io SDK
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # 1. Add Start.io SDK dependency
          # ---------------------------------------------------------

          app_gradle = Path("android/app/build.gradle")

          if not app_gradle.exists():
              raise SystemExit(
                  "android/app/build.gradle was not created"
              )

          gradle_text = app_gradle.read_text()

          dependency = "implementation 'com.startapp:inapp-sdk:5.+'"

          if dependency not in gradle_text:
              marker = "dependencies {"

              if marker not in gradle_text:
                  raise SystemExit(
                      "dependencies block not found"
                  )

              gradle_text = gradle_text.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

              app_gradle.write_text(gradle_text)

          print("Start.io dependency configured.")

          # ---------------------------------------------------------
          # 2. Find MainActivity.java
          # ---------------------------------------------------------

          java_files = list(
              Path(
                  "android/app/src/main/java"
              ).rglob("MainActivity.java")
          )

          if not java_files:
              raise SystemExit(
                  "MainActivity.java not found"
              )

          main_activity = java_files[0]

          original = main_activity.read_text()

          # ---------------------------------------------------------
          # 3. Read package name
          # ---------------------------------------------------------

          package_line = None

          for line in original.splitlines():
              if line.startswith("package "):
                  package_line = line
                  break

          if not package_line:
              raise SystemExit(
                  "Package declaration not found"
              )

          # ---------------------------------------------------------
          # 4. Create correct MainActivity.java
          # ---------------------------------------------------------

          new_activity = f'''{package_line}

          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.FrameLayout;

          import com.getcapacitor.BridgeActivity;
          import com.startapp.sdk.ads.banner.Banner;
          import com.startapp.sdk.adsbase.StartAppSDK;

          public class MainActivity extends BridgeActivity {{

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  StartAppSDK.initParams(this, "208328103")
                      .setReturnAdsEnabled(false)
                      .setCallback(() -> {{
                          Banner banner = new Banner(this);

                          FrameLayout.LayoutParams params =
                              new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.WRAP_CONTENT
                              );

                          params.gravity = Gravity.BOTTOM;

                          addContentView(banner, params);
                      }})
                      .init();
              }}
          }}
          '''

          main_activity.write_text(new_activity)

          print(
              f"Start.io configured in {main_activity}"
          )

          # ---------------------------------------------------------
          # 5. Add required permissions to AndroidManifest.xml
          # ---------------------------------------------------------

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():

              manifest_text = manifest.read_text()

              internet_permission = (
                  '<uses-permission android:name="android.permission.INTERNET" />'
              )

              network_permission = (
                  '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
              )

              if "android.permission.INTERNET" not in manifest_text:
                  manifest_text = manifest_text.replace(
                      "<manifest",
                      "<manifest",
                      1
                  )

                  first_close = manifest_text.find(">")

                  if first_close != -1:
                      manifest_text = (
                          manifest_text[:first_close + 1]
                          + "\n    "
                          + internet_permission
                          + "\n    "
                          + network_permission
                          + manifest_text[first_close + 1:]
                      )

              elif "android.permission.ACCESS_NETWORK_STATE" not in manifest_text:
                  first_close = manifest_text.find(">")

                  if first_close != -1:
                      manifest_text = (
                          manifest_text[:first_close + 1]
                          + "\n    "
                          + network_permission
                          + manifest_text[first_close + 1:]
                      )

              manifest.write_text(manifest_text)

          print("Android permissions configured.")

          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
```
