```yaml
name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0"

      - name: Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Update Android Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/build.gradle")

          if not gradle_file.exists():
              raise SystemExit("android/build.gradle not found")

          text = gradle_file.read_text()

          text = text.replace(
              "com.android.tools.build:gradle:8.7.2",
              "com.android.tools.build:gradle:8.13.0"
          )

          gradle_file.write_text(text)

          print("Android Gradle Plugin updated to 8.13.0")
          PY

      - name: Update Gradle Wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if not wrapper.exists():
              raise SystemExit("Gradle wrapper not found")

          text = wrapper.read_text()

          text = text.replace(
              "gradle-8.11.1-all.zip",
              "gradle-8.14.3-all.zip"
          )

          wrapper.write_text(text)

          print("Gradle wrapper updated to 8.14.3")
          PY

      - name: Update compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_gradle = Path("android/app/build.gradle")

          if not app_gradle.exists():
              raise SystemExit("android/app/build.gradle not found")

          text = app_gradle.read_text()

          text = text.replace(
              "compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35",
              "compileSdk 37"
          )

          text = text.replace(
              "compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35",
              "compileSdk = 37"
          )

          app_gradle.write_text(text)

          print("compileSdk updated to 37")
          PY

      - name: Configure Start.io SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # -------------------------------------------------
          # Add Start.io dependency
          # -------------------------------------------------

          gradle = Path("android/app/build.gradle")

          text = gradle.read_text()

          dependency = "implementation 'com.startapp:inapp-sdk:5.3.2'"

          if dependency not in text:
              if "dependencies {" not in text:
                  raise SystemExit(
                      "dependencies block not found"
                  )

              text = text.replace(
                  "dependencies {",
                  "dependencies {\n    " + dependency,
                  1
              )

              gradle.write_text(text)

          print("Start.io SDK dependency added.")

          # -------------------------------------------------
          # Find MainActivity.java
          # -------------------------------------------------

          java_files = list(
              Path(
                  "android/app/src/main/java"
              ).rglob("MainActivity.java")
          )

          if not java_files:
              raise SystemExit(
                  "MainActivity.java not found"
              )

          activity = java_files[0]

          original = activity.read_text()

          package_line = ""

          for line in original.splitlines():
              if line.startswith("package "):
                  package_line = line
                  break

          if not package_line:
              raise SystemExit(
                  "Package declaration not found"
              )

          # -------------------------------------------------
          # Create MainActivity
          # -------------------------------------------------

          new_activity = f"""{package_line}

import android.os.Bundle;
import android.view.Gravity;
import android.widget.FrameLayout;

import com.getcapacitor.BridgeActivity;
import com.startapp.sdk.ads.banner.Banner;
import com.startapp.sdk.adsbase.StartAppSDK;

public class MainActivity extends BridgeActivity {{

    @Override
    public void onCreate(Bundle savedInstanceState) {{
        super.onCreate(savedInstanceState);

        StartAppSDK.initParams(this, "208328103")
            .setReturnAdsEnabled(false)
            .setCallback(() -> {{

                Banner banner = new Banner(this);

                FrameLayout.LayoutParams params =
                    new FrameLayout.LayoutParams(
                        FrameLayout.LayoutParams.MATCH_PARENT,
                        FrameLayout.LayoutParams.WRAP_CONTENT
                    );

                params.gravity = Gravity.BOTTOM;

                addContentView(banner, params);
            }})
            .init();
    }}
}}
"""

          activity.write_text(new_activity)

          print(
              f"Start.io configured in {activity}"
          )

          # -------------------------------------------------
          # Android permissions
          # -------------------------------------------------

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():

              manifest_text = manifest.read_text()

              internet = (
                  '<uses-permission '
                  'android:name="android.permission.INTERNET" />'
              )

              network = (
                  '<uses-permission '
                  'android:name="android.permission.ACCESS_NETWORK_STATE" />'
              )

              if "android.permission.INTERNET" not in manifest_text:
                  pos = manifest_text.find(">")

                  manifest_text = (
                      manifest_text[:pos + 1]
                      + "\n    "
                      + internet
                      + "\n    "
                      + network
                      + manifest_text[pos + 1:]
                  )

              elif (
                  "android.permission.ACCESS_NETWORK_STATE"
                  not in manifest_text
              ):
                  pos = manifest_text.find(">")

                  manifest_text = (
                      manifest_text[:pos + 1]
                      + "\n    "
                      + network
                      + manifest_text[pos + 1:]
                  )

              manifest.write_text(manifest_text)

          print("Android permissions configured.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
```
