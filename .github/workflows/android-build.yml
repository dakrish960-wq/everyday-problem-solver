name: Build Android APK and AAB

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;35.0.0"

      - name: Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Set compile SDK 37
        run: |
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 37/g' android/variables.gradle
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 37/g' android/build.gradle
          sed -i 's/compileSdk 35/compileSdk 37/g' android/app/build.gradle

      - name: Update Gradle
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.14.3

      - name: Add Start.io dependency
        run: |
          sed -i '/dependencies {/a\    implementation "com.startapp:inapp-sdk:5.3.2"' android/app/build.gradle

      - name: Configure Start.io MainActivity
        run: |
          ACTIVITY=$(find android/app/src/main/java -name MainActivity.java | head -n 1)

          PACKAGE=$(grep '^package ' "$ACTIVITY")

          cat > "$ACTIVITY" <<EOF
          $PACKAGE

          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.FrameLayout;

          import com.getcapacitor.BridgeActivity;
          import com.startapp.sdk.ads.banner.Banner;
          import com.startapp.sdk.adsbase.StartAppSDK;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  StartAppSDK.initParams(this, "208328103")
                      .setReturnAdsEnabled(false)
                      .setCallback(() -> {

                          Banner banner = new Banner(this);

                          FrameLayout.LayoutParams params =
                              new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.WRAP_CONTENT
                              );

                          params.gravity = Gravity.BOTTOM;

                          addContentView(banner, params);
                      })
                      .init();
              }
          }
          EOF

      - name: Add Internet permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
```
