name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Add Android
        run: npx cap add android

      - name: Add Start.io SDK
        run: |
          python3 -c "from pathlib import Path; p=Path('android/app/build.gradle'); t=p.read_text(); t=t.replace('dependencies {', 'dependencies {\n    implementation \\'com.startapp:inapp-sdk:5.0.2\\'', 1); p.write_text(t)"

      - name: Configure Start.io
        run: |
          python3 -c "from pathlib import Path; p=next(Path('android/app/src/main/java').rglob('MainActivity.java')); t=p.read_text(); t=t.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport android.view.Gravity;\nimport android.widget.FrameLayout;\nimport com.startapp.sdk.ads.banner.Banner;\nimport com.startapp.sdk.adsbase.StartAppSDK;'); t=t.replace('public class MainActivity extends BridgeActivity {}', 'public class MainActivity extends BridgeActivity { @Override public void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); StartAppSDK.initParams(this, \"208328103\").setReturnAdsEnabled(false).setCallback(() -> { Banner banner = new Banner(this); FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT); params.gravity = Gravity.BOTTOM; addContentView(banner, params); }).init(); } }'); p.write_text(t)"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
