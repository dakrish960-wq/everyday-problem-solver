
name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Add Android
        run: npx cap add android

      - name: Set Android SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          if not p.exists():
              raise SystemExit("ERROR: android/variables.gradle not found")

          text = p.read_text()

          text = re.sub(
              r'compileSdkVersion\s*=\s*\d+',
              'compileSdkVersion = 36',
              text
          )

          text = re.sub(
              r'targetSdkVersion\s*=\s*\d+',
              'targetSdkVersion = 36',
              text
          )

          p.write_text(text)

          print("===== Android SDK configuration =====")
          print(text)
          print("====================================")

      - name: Verify Android SDK 36
        run: |
          echo "Checking Android SDK configuration..."

          grep -n "compileSdkVersion" android/variables.gradle
          grep -n "targetSdkVersion" android/variables.gradle

          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle

          echo "SUCCESS: compileSdkVersion = 36"
          echo "SUCCESS: targetSdkVersion = 36"

      - name: Add Start.io SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = "implementation 'com.startapp:inapp-sdk:5.0.2'"

          if dependency not in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {\n    " + dependency,
                  1
              )

          p.write_text(text)

          print("Start.io SDK configured.")
          PY

      - name: Configure Start.io
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java_files = list(
              Path("android/app/src/main/java").rglob("MainActivity.java")
          )

          if not java_files:
              raise SystemExit("ERROR: MainActivity.java not found")

          p = java_files[0]
          t = p.read_text()

          if "com.startapp.sdk.ads.banner.Banner;" not in t:
              t = t.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  """import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import com.startapp.sdk.ads.banner.Banner;
          import com.startapp.sdk.adsbase.StartAppSDK;"""
              )

          old = "public class MainActivity extends BridgeActivity {}"

          new = """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  StartAppSDK.initParams(this, "208328103")
                      .setReturnAdsEnabled(false)
                      .setCallback(() -> {
                          Banner banner = new Banner(this);

                          FrameLayout.LayoutParams params =
                              new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.WRAP_CONTENT
                              );

                          params.gravity = Gravity.BOTTOM;
                          params.bottomMargin =
                              (int) (88 * getResources().getDisplayMetrics().density);

                          addContentView(banner, params);
                      })
                      .init();
              }
          }"""

          if old in t:
              t = t.replace(old, new)

          p.write_text(t)

          print("Start.io configuration completed.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify final Android configuration
        run: |
          echo "===== FINAL ANDROID CONFIGURATION ====="
          grep -n "compileSdkVersion" android/variables.gradle || true
          grep -n "targetSdkVersion" android/variables.gradle || true
          echo "========================================"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          echo "Keystore decoded successfully."
          ls -lh android/upload-keystore.jks

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/app/build.gradle")
          text = file.read_text()

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("../upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  "android {\n" + signing_config,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          file.write_text(text)

          print("Release signing configured.")
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Verify Release AAB
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          echo "Release AAB created successfully."
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
