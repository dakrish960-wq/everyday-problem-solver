name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Configure Start.io
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          dependency = "implementation 'com.startapp:inapp-sdk:5.+'"

          if dependency not in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {\n    " + dependency,
                  1
              )
              gradle.write_text(text)

          activity = list(
              Path("android/app/src/main/java").rglob("MainActivity.java")
          )[0]

          package_line = ""

          for line in activity.read_text().splitlines():
              if line.startswith("package "):
                  package_line = line
                  break

          if not package_line:
              raise SystemExit("Package name not found")

          new_code = f"""{package_line}

          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.FrameLayout;

          import com.getcapacitor.BridgeActivity;
          import com.startapp.sdk.ads.banner.Banner;
          import com.startapp.sdk.adsbase.StartAppSDK;

          public class MainActivity extends BridgeActivity {{

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  StartAppSDK.initParams(this, "208328103")
                      .setReturnAdsEnabled(false)
                      .setCallback(() -> {{
                          Banner banner = new Banner(this);

                          FrameLayout.LayoutParams params =
                              new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.WRAP_CONTENT
                              );

                          params.gravity = Gravity.BOTTOM;

                          addContentView(banner, params);
                      }})
                      .init();
              }}
          }}
          """

          activity.write_text(new_code)

          print("Start.io configured successfully.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
