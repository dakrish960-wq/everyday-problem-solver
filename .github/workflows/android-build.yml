```yaml
name: Build Android APK and AAB

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;35.0.0"

      - name: Add Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Configure Android
        run: |
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 37/g' android/variables.gradle || true
          sed -i 's/compileSdk 35/compileSdk 37/g' android/app/build.gradle || true

          sed -i '/dependencies {/a\    implementation "com.startapp:inapp-sdk:5.3.2"' android/app/build.gradle

      - name: Update Gradle
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.14.3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Everyday-Problem-Solver-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
```
